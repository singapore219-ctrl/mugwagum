<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c12">
<title>무과금 게임방</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e0c12;--card:#18151f;--line:rgba(255,255,255,.09);--text:#ece8f4;--dim:rgba(236,232,244,.58);--acc:#c9a8ff;--gold:#f1d58c}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -10%,rgba(110,60,200,.35),transparent 60%),var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:clamp(28px,8vw,40px);margin:0;color:var(--acc);text-shadow:0 0 26px rgba(167,123,255,.5)}
.sub{color:var(--dim);font-size:13px;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}
a.g{position:relative;display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;overflow:hidden;transition:transform .12s}
a.g:active{transform:scale(.98)}
a.g::before{content:'';position:absolute;inset:0;background:var(--tint);opacity:.16;pointer-events:none}
.art{flex:none;width:62px;height:62px;border-radius:12px;display:grid;place-items:center;font-size:32px;background:var(--tint);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.grow{flex:1;min-width:0;position:relative}
.nm{font-weight:700;font-size:15.5px}
.ds{font-size:12px;color:var(--dim);margin-top:2px;line-height:1.45}
.tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
.tag.cont{background:#7a5ad0;color:#fff}
.tag.last{background:var(--gold);color:#2a1f0a}
.arrow{color:var(--dim);font-size:20px;position:relative}
.foot{margin-top:18px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>무과금 게임방</h1>
  <div class="sub">혼자 즐기는 무과금 게임 모음 · 저장은 이 기기에 남아요</div>
  <div class="grid" id="grid"></div>
  <div class="foot">3D 모델: KayKit by Kay Lousberg (CC0)</div>
</div>
<script>
// key: localStorage save key used by that game (to show "이어하기")
const GAMES = [
  { id: 'hunt', n: '무과금 사냥터', ic: '⚔️', tint: 'linear-gradient(135deg,#8a5a2a,#3a2410)', d: '3D 사냥·파밍·강화. 자동 사냥과 변신, 펫', o: '가로', key: 'mugwagum-hunt-v1' },
  { id: 'front', n: '그림자 전선', ic: '🛡️', tint: 'linear-gradient(135deg,#6a3cd8,#3a1460)', d: '건물이 병사를 뽑는 1:1 기지 대결. 학습한 AI 지휘관', o: '세로', key: 'mug-front-v1' },
  { id: 'kingdom', n: '무과금 왕국', ic: '🏰', tint: 'linear-gradient(135deg,#4a7a3a,#1a3018)', d: '영지를 키우는 방치형 전략. AI 영주 11명과 왕좌 쟁탈', o: '세로·가로', key: 'mug-kingdom-v1' },
  { id: 'siege', n: '그림자 공성전', ic: '🗼', tint: 'linear-gradient(135deg,#7a3a6a,#2a1028)', d: '영웅 1:1 공성전. 강화학습 AI 두뇌', o: '가로', key: 'mug-siege-v1' },
  { id: 'shadow', n: '흑영 군단', ic: '👁️', tint: 'linear-gradient(135deg,#3a2a6a,#120a24)', d: '쓰러진 적을 그림자로 일으키는 무한 방치 몰이사냥', o: '가로', key: 'mug-shadow-v1' },
  { id: 'chess', n: '무과금 오토체스', ic: '♟️', tint: 'linear-gradient(135deg,#2a6a8a,#0e2a38)', d: '용병을 배치하는 오토배틀러. 친구와 하기', o: '가로·세로', key: 'mug-chess' },
  { id: 'war', n: '무과금 영토전쟁', ic: '🚩', tint: 'linear-gradient(135deg,#8a3a2a,#2a0e08)', d: '방치형 웨이브 디펜스로 영토 넓히기', o: '가로', key: 'mug-war-v1' },
  { id: 'defense', n: '무과금 룬 디펜스', ic: '🔮', tint: 'linear-gradient(135deg,#2a5a8a,#101a38)', d: '룬을 소환하고 합쳐서 막는 랜덤 머지 디펜스', o: '세로·가로', key: 'mug-defense-v1' },
];
const has = k => { try { return !!(k && localStorage.getItem(k)); } catch (e) { return false; } };
let last = null; try { last = localStorage.getItem('mug-last-game'); } catch (e) {}
document.getElementById('grid').innerHTML = GAMES.map(g => `<a class="g" href="${g.id}/" data-id="${g.id}" style="--tint:${g.tint}">
  <div class="art">${g.ic}</div><div class="grow"><div class="nm">${g.n}</div><div class="ds">${g.d}</div>
  <div class="tags"><span class="tag">${g.o} 화면</span>${has(g.key) ? '<span class="tag cont">이어하기</span>' : ''}${last === g.id ? '<span class="tag last">마지막에 한 게임</span>' : ''}</div></div><div class="arrow">›</div></a>`).join('');
document.getElementById('grid').addEventListener('click', e => { const a = e.target.closest('a.g'); if (a) try { localStorage.setItem('mug-last-game', a.dataset.id); } catch (er) {} });
// games lock their own orientation; the picker lets the phone turn freely
try { if (screen.orientation && screen.orientation.unlock && matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) screen.orientation.unlock(); } catch (e) {}
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
